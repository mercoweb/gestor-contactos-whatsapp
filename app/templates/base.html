<!DOCTYPE html>
<html lang="es">
<head>

  <title>{% block titulo %}Gestor de Contactos WhatsApp{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if sesion %}
  <nav class="nav">
    <span class="marca">📱 Gestor WhatsApp</span>
    <a href="/">Panel</a>
    <a href="/contactos">Contactos</a>
    <a href="/importar">Importar CSV</a>

  </nav>

  <div class="contenedor">
    {% block contenido %}{% endblock %}
  </div>
</body>
</html>
